<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payments</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="page-header">
        <div>
          <h1>Payments</h1>
        </div>
        <div class="header-actions"><button id="sign-out-button" class="button secondary hidden" type="button">Sign out</button></div>
      </header>

      <section id="auth-panel" class="panel auth-panel">
        <h2>Sign in</h2>
        <p>Sign in with the Supabase account authorized in <code>supabase.sql</code>.</p>
        <form id="sign-in-form" class="inline-form">
          <label>Email<input id="login-email" type="email" autocomplete="email" required /></label>
          <label>Password<input id="login-password" type="password" autocomplete="current-password" required /></label>
          <button class="button" type="submit">Sign in</button>
        </form>
        <p id="auth-message" class="message" aria-live="polite"></p>
      </section>

      <section id="payments-app" class="hidden">
        <section class="panel">
          <h2 id="form-title">Add payment</h2>
          <form id="payment-form" class="payment-form">
            <input id="payment-id" type="hidden" />
            <label>Payer
              <select id="payer" required>
                <option value="" selected disabled>Select payer</option>
                <option value="Chunyang Tong">Chunyang Tong</option>
                <option value="Xiaomeng Sun">Xiaomeng Sun</option>
                <option value="Yijie Ru">Yijie Ru</option>
                <option value="Xiaoquan Zhang">Xiaoquan Zhang</option>
                <option value="Zijun Chen">Zijun Chen</option>
                <option value="Bingbing">Bingbing</option>
              </select>
            </label>
            <label>Payment Type
              <select id="payment-type" required>
                <option value="" selected disabled>Select payment type</option>
                <option value="租金">租金</option>
                <option value="Utility">Utility</option>
                <option value="押金">押金</option>
              </select>
            </label>
            <label>Direction
              <select id="transaction-direction" required><option value="received">收款</option><option value="paid">付款</option></select>
            </label>
            <label>Amount<input id="amount" type="number" min="0" step="0.01" required /></label>
            <label>Currency
              <select id="currency" required><option value="USD">USD</option><option value="CNY">CNY</option></select>
            </label>
            <label id="usd-equivalent-field" class="hidden">USD Equivalent
              <input id="usd-equivalent" type="number" min="0" step="0.01" placeholder="Manual USD amount" />
            </label>
            <label>Note<input id="note" type="text" /></label>
            <label>Payment Date<input id="payment-date" type="date" required /></label>
            <div class="form-actions"><button id="save-button" class="button" type="submit">Add</button><button id="cancel-edit-button" class="button secondary hidden" type="button">Cancel</button></div>
          </form>
          <p id="form-message" class="message" aria-live="polite"></p>
        </section>

        <section class="panel table-panel">
          <div class="table-toolbar">
            <h2>Payments</h2>
            <div class="filters" aria-label="Payment filters">
              <label>Month <select id="month-filter"><option value="">All months</option></select></label>
              <label>Payer
                <select id="payer-filter"><option value="">All payers</option><option value="Chunyang Tong">Chunyang Tong</option><option value="Xiaomeng Sun">Xiaomeng Sun</option><option value="Yijie Ru">Yijie Ru</option><option value="Xiaoquan Zhang">Xiaoquan Zhang</option><option value="Zijun Chen">Zijun Chen</option><option value="Bingbing">Bingbing</option></select>
              </label>
              <label>Payment Type
                <select id="payment-type-filter"><option value="">All types</option><option value="租金">租金</option><option value="Utility">Utility</option><option value="押金">押金</option></select>
              </label>
              <label>Direction
                <select id="direction-filter"><option value="">All directions</option><option value="received">收款</option><option value="paid">付款</option></select>
              </label>
              <label class="note-combobox">Note
                <input id="note-filter" type="search" autocomplete="off" placeholder="Type to find a note" aria-autocomplete="list" aria-controls="note-options" />
                <div id="note-options" class="note-options hidden" role="listbox"></div>
              </label>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Month</th><th>Payer</th><th>Type</th><th>Direction</th><th>Amount</th><th>USD Equivalent</th><th>Note</th><th>Payment Date</th><th>Actions</th></tr></thead>
              <tbody id="payments-body"></tbody>
              <tfoot id="payments-total" class="hidden"></tfoot>
            </table>
          </div>
          <section id="outstanding-panel" class="outstanding-panel hidden" aria-live="polite">
            <div class="outstanding-heading"><div><h3>待支付</h3></div></div>
            <div class="outstanding-grid">
              <label>租金应付（USD）<input id="rent-due" type="number" min="0" step="0.01" placeholder="0.00" /></label>
              <div id="rent-outstanding" class="outstanding-card"></div>
              <label>Utility 应付（USD）<input id="utility-due" type="number" min="0" step="0.01" placeholder="0.00" /></label>
              <div id="utility-outstanding" class="outstanding-card"></div>
            </div>
          </section>
        </section>

        <section class="panel deposit-panel">
          <div class="deposit-heading"><div><h2>押金进度</h2><p>金额以 USD 计算</p></div></div>
          <div id="deposit-cards" class="deposit-cards"></div>
        </section>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
